name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/ReSkateMusicPacker.exe package/
          Copy-Item LICENSE, README.md package/
          Compress-Archive -Path package/* -DestinationPath "ReSkateMusicPacker-${{ github.ref_name }}-win64.zip"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ReSkateMusicPacker-${{ github.ref_name }}-win64.zip
            build/Release/ReSkateMusicPacker.exe
          generate_release_notes: true
